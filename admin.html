<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLegends Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
        
        /* Login Screen */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .login-box p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
        }
        
        .login-box input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .login-box input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .login-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .login-box button:hover {
            opacity: 0.9;
        }
        
        .error-msg {
            color: #ff6b6b;
            margin-top: 15px;
            display: none;
        }
        
        /* Dashboard */
        #dashboard {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-danger {
            background: #ff4757;
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #00e5ff, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-card p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        
        /* Users Table */
        .table-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .table-header h2 {
            font-size: 18px;
        }
        
        .search-box {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            width: 250px;
        }
        
        .search-box::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        tr:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        .user-name {
            font-weight: 500;
        }
        
        .user-email {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-success {
            background: rgba(0, 230, 118, 0.2);
            color: #00e676;
        }
        
        .badge-warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .badge-info {
            background: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255,255,255,0.5);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .no-data {
            text-align: center;
            padding: 60px;
            color: rgba(255,255,255,0.5);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .table-container {
                overflow-x: auto;
            }
            
            table {
                min-width: 800px;
            }
            
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h1>🔐 Admin Login</h1>
            <p>LogLegends Dashboard</p>
            <input type="password" id="admin-password" placeholder="Enter admin password" onkeypress="if(event.key === 'Enter') adminLogin()">
            <button onclick="adminLogin()">Login</button>
            <p class="error-msg" id="login-error">Invalid password</p>
        </div>
    </div>
    
    <!-- Dashboard -->
    <div id="dashboard">
        <div class="header">
            <h1>📊 LogLegends Admin Dashboard</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshData()">🔄 Refresh</button>
                <button class="btn btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
                <button class="btn btn-danger" onclick="adminLogout()">Logout</button>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="stat-users">-</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-hours">-</h3>
                <p>Total Hours Logged</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-trips">-</h3>
                <p>Total Trips</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-active">-</h3>
                <p>Active This Week</p>
            </div>
        </div>
        
        <!-- Users Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>👥 All Users</h2>
                <input type="text" class="search-box" id="search-input" placeholder="Search by name or email..." oninput="filterUsers()">
            </div>
            <div id="users-table-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading users...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyCr5wvKZokrY0xwYo-Sbkzahzh8WknXHb4",
            authDomain: "lead-finder-pro-27bf2.firebaseapp.com",
            projectId: "lead-finder-pro-27bf2",
            storageBucket: "lead-finder-pro-27bf2.firebasestorage.app",
            messagingSenderId: "197510050244",
            appId: "1:197510050244:web:f2baf1b7ff0b81c1fb7491"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Store users globally for filtering
        window.allUsers = [];
        
        // Admin password - change this!
        const ADMIN_PASSWORD = 'LogLegends2024!';
        
        // Check if already logged in
        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            showDashboard();
            loadUsers();
        }
        
        // Login function
        window.adminLogin = function() {
            const password = document.getElementById('admin-password').value;
            
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_logged_in', 'true');
                showDashboard();
                loadUsers();
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('admin-password').value = '';
            }
        };
        
        // Logout function
        window.adminLogout = function() {
            sessionStorage.removeItem('admin_logged_in');
            location.reload();
        };
        
        // Show dashboard
        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }
        
        // Load all users from Firebase
        async function loadUsers() {
            try {
                const usersRef = collection(db, 'users');
                const snapshot = await getDocs(usersRef);
                
                window.allUsers = [];
                let totalHours = 0;
                let totalTrips = 0;
                let activeThisWeek = 0;
                
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const user = {
                        id: doc.id,
                        name: data.userName || 'Unknown',
                        email: data.userEmail || 'N/A',
                        totalHours: data.stats?.totalHours || 0,
                        nightHours: data.stats?.nightHours || 0,
                        trips: data.stats?.trips?.length || 0,
                        lastUpdated: data.lastUpdated || 'Never',
                        weather: getLastWeather(data.stats?.trips)
                    };
                    
                    window.allUsers.push(user);
                    totalHours += user.totalHours;
                    totalTrips += user.trips;
                    
                    // Check if active this week
                    if (data.lastUpdated) {
                        try {
                            const lastUpdate = new Date(data.lastUpdated);
                            if (lastUpdate > oneWeekAgo) {
                                activeThisWeek++;
                            }
                        } catch (e) {}
                    }
                });
                
                // Sort by total hours (most active first)
                window.allUsers.sort((a, b) => b.totalHours - a.totalHours);
                
                // Update stats
                document.getElementById('stat-users').textContent = window.allUsers.length;
                document.getElementById('stat-hours').textContent = totalHours.toFixed(1);
                document.getElementById('stat-trips').textContent = totalTrips;
                document.getElementById('stat-active').textContent = activeThisWeek;
                
                // Render table
                renderUsersTable(window.allUsers);
                
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-table-container').innerHTML = `
                    <div class="no-data">
                        <p>❌ Error loading users: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Get last weather from trips
        function getLastWeather(trips) {
            if (!trips || trips.length === 0) return null;
            
            // Find last trip with weather
            for (let i = trips.length - 1; i >= 0; i--) {
                if (trips[i].weather) {
                    return trips[i].weather;
                }
            }
            return null;
        }
        
        // Render users table
        function renderUsersTable(users) {
            if (users.length === 0) {
                document.getElementById('users-table-container').innerHTML = `
                    <div class="no-data">
                        <p>No users found</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Total Hours</th>
                            <th>Night Hours</th>
                            <th>Trips</th>
                            <th>Progress</th>
                            <th>Last Active</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            users.forEach(user => {
                const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                const progress = Math.min((user.totalHours / 60) * 100, 100).toFixed(0);
                
                let progressBadge = '';
                if (progress >= 100) {
                    progressBadge = '<span class="badge badge-success">Complete</span>';
                } else if (progress >= 50) {
                    progressBadge = `<span class="badge badge-info">${progress}%</span>`;
                } else {
                    progressBadge = `<span class="badge badge-warning">${progress}%</span>`;
                }
                
                html += `
                    <tr>
                        <td>
                            <div class="user-info">
                                <div class="user-avatar">${initials}</div>
                                <div>
                                    <div class="user-name">${escapeHtml(user.name)}</div>
                                    <div class="user-email">${escapeHtml(user.email)}</div>
                                </div>
                            </div>
                        </td>
                        <td>${user.totalHours.toFixed(1)}h</td>
                        <td>${user.nightHours.toFixed(1)}h</td>
                        <td>${user.trips}</td>
                        <td>${progressBadge}</td>
                        <td>${escapeHtml(user.lastUpdated)}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('users-table-container').innerHTML = html;
        }
        
        // Filter users
        window.filterUsers = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            
            if (!query) {
                renderUsersTable(window.allUsers);
                return;
            }
            
            const filtered = window.allUsers.filter(user => 
                user.name.toLowerCase().includes(query) || 
                user.email.toLowerCase().includes(query)
            );
            
            renderUsersTable(filtered);
        };
        
        // Refresh data
        window.refreshData = function() {
            document.getElementById('users-table-container').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Refreshing...</p>
                </div>
            `;
            loadUsers();
        };
        
        // Export to CSV
        window.exportCSV = function() {
            if (window.allUsers.length === 0) {
                alert('No data to export');
                return;
            }
            
            let csv = 'Name,Email,Total Hours,Night Hours,Trips,Progress %,Last Active\n';
            
            window.allUsers.forEach(user => {
                const progress = Math.min((user.totalHours / 60) * 100, 100).toFixed(0);
                csv += `"${user.name}","${user.email}",${user.totalHours.toFixed(1)},${user.nightHours.toFixed(1)},${user.trips},${progress}%,"${user.lastUpdated}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LogLegends_Users_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };
        
        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
